worker_processes 2;
events { worker_connections 8192; }
http {
  access_log off;
  upstream mock { server mock:9000; keepalive 512; }
  server {
    listen 8080;
    location / {
      proxy_pass http://mock;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
}
