_format_version: "3.0"
services:
  - name: llm
    url: http://mock:9000
    routes:
      - name: chat
        paths: ["/v1/chat/completions"]
        strip_path: false
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              auth:
                header_name: Authorization
                header_value: Bearer sk-mock
              model:
                provider: openai
                name: gpt-mock
                options:
                  upstream_url: http://mock:9000/v1/chat/completions
